# fly.toml app configuration file generated for mantus on 2026-07-15T17:20:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "mantus"
# dfw picked 2026-08-03: Spectrum Florida ingresses at Fly's Dallas edge, so
# dfw hosting removes the dfw→iad backbone leg for those players. Note the DB
# region decision is still open (no Managed Postgres in dfw; see TODO.md).
primary_region = "dfw"

# Deploy from the repo root (the Dockerfile copies protocol/, content/,
# config.yml, ...):
#   fly deploy -a mantus -c server/fly.toml --dockerfile server/Dockerfile .
# No [build] section: the dockerfile is passed on the CLI so the build context
# can be the repo root instead of server/.

[env]
  SERVER_PORT = "4000"
  STATUS_PORT = "7171"
  # Dedicated IPv4 allocated 2026-09-07 (`fly ips allocate-v4`); echoed in the
  # status XML, and the address the otservlist listing points at.
  STATUS_IP = "188.93.144.4"
  # Fly's proxy sets Fly-Client-IP; required for the per-IP connection limit.
  TRUST_PROXY = "1"

# Raw TCP service with the http/tls handlers: WebSocket upgrades pass through,
# and health checking stays at the TCP level (the ws server answers HTTP GETs
# with 426, which would fail an HTTP check).

[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Matches maxSessions (100) in server config.

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

# OpenTibia status protocol for otservlist.org (see `status` in config.yml).
# Raw TCP with no handlers: the probe is 8 non-TLS bytes, so it can only reach
# the app through the dedicated IPv4 (`fly ips allocate-v4`), never the shared
# one, which routes by SNI/Host.

[[services]]
  internal_port = 7171
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 32
    soft_limit = 16

  [[services.ports]]
    port = 7171

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
  processes = ['app']
