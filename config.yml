# Non-secret game-server settings. Credentials and connection strings belong in
# server/.env; browser-visible settings belong in client/.env.local.

server:
  port: 4000
  tickMs: 25
  heartbeatMs: 30000
  authTimeoutMs: 10000

development:
  # Never enable either setting in production.
  auth: false
  commands: false

network:
  # Enable only behind a trusted proxy that replaces Fly-Client-IP.
  trustProxyHeader: false
  maxSessions: 2000
  # Extra connections held in the login queue once maxSessions is reached;
  # beyond this the server answers server-full and closes.
  maxLoginQueueSize: 200
  maxPendingIntents: 16
  maxProtocolViolations: 5
  defaultViewRange:
    x: 9
    y: 7

chat:
  # Flood control, enforced server-side. Canary's message buffer: 4 lines of
  # burst, one slot back every 1.5 s, the n-th overflow mutes for 5·n² seconds.
  bufferCapacity: 4
  bufferDrainMs: 1500
  muteBaseMs: 5000
  # Ten quiet minutes forgives one escalation level. The counter survives
  # relogging (but not a restart — see TODO.md).
  escalationDecayMs: 600000

moderation:
  # Retention for moderation metadata (actions, reports, expired mutes and
  # bans). Rows older than this are pruned; see docs/moderation-retention.md.
  retentionDays: 365

combat:
  seed: 1129270594

rates:
  # Non-negative up to 1000. Fractional progression is floored to whole units.
  experience: 2
  skill: 2
  magic: 2
  loot: 4
  spawn: 2
  # Soul regeneration, offline-training, and exercise-weapon training speeds.
  soulRegen: 5
  offlineTraining: 1
  exerciseTraining: 1
  # Kill credit per death toward bestiary/bosstiary completion (integer >= 1).
  # The boosted boss's triple credit stacks on top of bosstiaryKills.
  bestiaryKills: 2
  bosstiaryKills: 2

# Rarity drops on equipable gear. Remove the whole block to disable; the
# affixCounts/valueMultipliers/affixes tables may each be omitted to run the
# built-in defaults.
rarity:
  # Chance (percent of eligible equipment drops) to roll each grade;
  # fractions down to 0.001 are honored. Grades roll best-first, so an item
  # checks legendary, then epic, rare, uncommon.
  chances:
    uncommon: 5
    rare: 1
    epic: 0.2
    legendary: 0.04
  # How many distinct affixes each grade rolls (an affix id never repeats
  # on one item).
  affixCounts:
    uncommon: 1
    rare: 2
    epic: 3
    legendary: 4
  # Rolled values scale by the grade's multiplier before rounding (minimum
  # 1 after rounding).
  valueMultipliers:
    uncommon: 1
    rare: 1.5
    epic: 2.25
    legendary: 3
  # Base roll band per affix at multiplier 1. `minimumRarity` keeps an affix
  # out of lower-grade pools. skill picks the weapon's skill (shielding on
  # non-weapons); resistance rolls one element; attackSpeed, leech, crit and
  # resistance values are percent.
  affixes:
    maxHealth: { min: 15, max: 40 }
    maxMana: { min: 20, max: 50 }
    attackSpeed: { min: 3, max: 8 }
    attack: { min: 1, max: 4 }
    defense: { min: 2, max: 6 }
    lifeLeech: { min: 1, max: 3 }
    manaLeech: { min: 1, max: 2 }
    critChance: { min: 1, max: 3 }
    critDamage: { min: 5, max: 15 }
    skill: { min: 1, max: 2 }
    magicLevel: { min: 1, max: 1, minimumRarity: rare }
    resistance: { min: 3, max: 8 }

progression:
  # Stamina gates hunting experience (green +50% / orange -50% / 0 = none).
  staminaSystem: true
  # Level-banded rate tables (Canary's data/stages.lua). While enabled they
  # replace the flat rates.experience/skill/magic multipliers above; switch
  # `enabled` off to run the flat rates instead.
  #
  # Bands must ascend and must not overlap. Only the last band of a table may
  # omit maxLevel, which makes it unbounded; a level outside every band falls
  # back to the flat rate. Up to 32 bands per table.
  stages:
    enabled: true
    # Fast through the early levels, then a long taper that settles at x2 from
    # level 1001 upwards.
    experience:
      - { minLevel: 1, maxLevel: 8, multiplier: 50 }
      - { minLevel: 9, maxLevel: 50, multiplier: 80 }
      - { minLevel: 51, maxLevel: 100, multiplier: 60 }
      - { minLevel: 101, maxLevel: 150, multiplier: 40 }
      - { minLevel: 151, maxLevel: 200, multiplier: 30 }
      - { minLevel: 201, maxLevel: 300, multiplier: 15 }
      - { minLevel: 301, maxLevel: 400, multiplier: 12 }
      - { minLevel: 401, maxLevel: 500, multiplier: 10 }
      - { minLevel: 501, maxLevel: 600, multiplier: 7 }
      - { minLevel: 601, maxLevel: 700, multiplier: 6 }
      - { minLevel: 701, maxLevel: 800, multiplier: 5 }
      - { minLevel: 801, maxLevel: 900, multiplier: 4 }
      - { minLevel: 901, maxLevel: 1000, multiplier: 3 }
      - { minLevel: 1001, multiplier: 2 }
    # Banded on the skill's own level (Canary skillsStages).
    skill:
      - { minLevel: 10, maxLevel: 60, multiplier: 15 }
      - { minLevel: 61, maxLevel: 80, multiplier: 10 }
      - { minLevel: 81, maxLevel: 110, multiplier: 6 }
      - { minLevel: 111, maxLevel: 125, multiplier: 4 }
      - { minLevel: 126, multiplier: 2 }
    # Banded on magic level (Canary magicLevelStages).
    magic:
      - { minLevel: 0, maxLevel: 60, multiplier: 10 }
      - { minLevel: 61, maxLevel: 80, multiplier: 7 }
      - { minLevel: 81, maxLevel: 100, multiplier: 5 }
      - { minLevel: 101, maxLevel: 110, multiplier: 4 }
      - { minLevel: 111, maxLevel: 125, multiplier: 3 }
      - { minLevel: 126, multiplier: 2 }

characters:
  starterTownId: 1
  saveIntervalMs: 30000
  maxSaveRetries: 3
  saveRetryDelayMs: 100

map:
  name: otservbr
  spawnTown: Thais

# Periodic sweep of items left lying on the ground (Canary's cleanMap), with a
# broadcast every minute of the countdown. Map furniture, house floors and
# items inside containers players carry are never touched.
mapCleanup:
  enabled: true
  intervalMs: 7200000
  # First warning this many minutes out, then one per minute down to 1.
  warningMinutes: 5
  # Canary's cleanProtectionZones: off, so depot and temple floors keep theirs.
  cleanProtectionZones: false

creatures:
  enabled: true
  contentName: world
  activationRange:
    x: 32
    y: 32
  retryMs: 1000
  maxSpawnChecksPerTick: 512
  maxSpawnAttemptsPerTick: 8
  maxAiScansPerTick: 512
  # Fits three full chase-box path searches per 25 ms tick; the 250 ms think
  # interval spreads the monsters that want one across ten ticks.
  maxAiWorkPerTick: 2048
  ai:
    thinkIntervalMs: 250
    acquisitionRange: 8
    loseRange: 12
    # Chase leash around the spawn point; spawn radius bounds idle wandering.
    despawnRadius: 50
    # One whole ±12 chase search box (25 x 25 = 625 tiles, see
    # chaseSearchDistance.ts) with slack for the unboxed walk-home search, so
    # any target a monster can see is reachable whenever a path exists.
    maxPathNodes: 640
    wanderChance: 0.2
    seed: 1296125524
