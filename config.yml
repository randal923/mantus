# Non-secret game-server settings. Credentials and connection strings belong in
# server/.env; browser-visible settings belong in client/.env.local.

server:
  port: 4000
  tickMs: 25
  heartbeatMs: 30000
  authTimeoutMs: 10000

development:
  # Never enable either setting in production.
  auth: false
  commands: false

network:
  # Enable only behind a trusted proxy that replaces Fly-Client-IP.
  trustProxyHeader: false
  maxSessions: 2000
  maxPendingIntents: 16
  maxProtocolViolations: 5
  defaultViewRange:
    x: 9
    y: 7

chat:
  # Flood control, enforced server-side. Canary's message buffer: 4 lines of
  # burst, one slot back every 1.5 s, the n-th overflow mutes for 5·n² seconds.
  bufferCapacity: 4
  bufferDrainMs: 1500
  muteBaseMs: 5000
  # Ten quiet minutes forgives one escalation level. The counter survives
  # relogging (but not a restart — see TODO.md).
  escalationDecayMs: 600000

moderation:
  # Retention for moderation metadata (actions, reports, expired mutes and
  # bans). Rows older than this are pruned; see docs/moderation-retention.md.
  retentionDays: 365

combat:
  seed: 1129270594

rates:
  # Non-negative up to 1000. Fractional progression is floored to whole units.
  experience: 2
  skill: 2
  magic: 2
  loot: 2
  spawn: 5
  # Soul regeneration, offline-training, and exercise-weapon training speeds.
  soulRegen: 5
  offlineTraining: 2
  exerciseTraining: 5
  # Kill credit per death toward bestiary/bosstiary completion (integer >= 1).
  # The boosted boss's triple credit stacks on top of bosstiaryKills.
  bestiaryKills: 2
  bosstiaryKills: 2

progression:
  # Stamina gates hunting experience (green +50% / orange -50% / 0 = none).
  staminaSystem: true
  # Use the level-banded experience/skill/magic stage tables (stageRates.ts)
  # instead of the flat rates above.
  useStages: false

characters:
  starterTownId: 1
  saveIntervalMs: 30000
  maxSaveRetries: 3
  saveRetryDelayMs: 100

map:
  name: otservbr
  spawnTown: Thais

creatures:
  enabled: true
  contentName: world
  activationRange:
    x: 32
    y: 32
  retryMs: 1000
  maxSpawnChecksPerTick: 512
  maxSpawnAttemptsPerTick: 8
  maxAiScansPerTick: 512
  # Fits three full chase-box path searches per 25 ms tick; the 250 ms think
  # interval spreads the monsters that want one across ten ticks.
  maxAiWorkPerTick: 2048
  ai:
    thinkIntervalMs: 250
    acquisitionRange: 8
    loseRange: 12
    # Chase leash around the spawn point; spawn radius bounds idle wandering.
    despawnRadius: 50
    # One whole ±12 chase search box (25 x 25 = 625 tiles, see
    # chaseSearchDistance.ts) with slack for the unboxed walk-home search, so
    # any target a monster can see is reachable whenever a path exists.
    maxPathNodes: 640
    wanderChance: 0.2
    seed: 1296125524
